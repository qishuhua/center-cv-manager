global:
  scrape_interval: 30s
  evaluation_interval: 15s
  external_labels:
    monitor: center-cv-development

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus-central
    static_configs:
      - targets: [prometheus:9090]

  # 仅拉取每个中心的一条 Prometheus 自身信息，用于判断指标接口是否可访问。
  # targets 目录由管理端 API 从中心表渲染（center-monitor-targets 卷），
  # file_sd 每分钟自动重读，新增/删除中心无需重启。
  - job_name: federate-centers
    honor_labels: true
    scrape_interval: 1m
    metrics_path: /prometheus/federate
    params:
      match[]:
        - prometheus_build_info
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 1m
