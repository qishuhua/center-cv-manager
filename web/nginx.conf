# 管理端前端：SPA 静态服务 + /api 反向代理到后端容器（center-cv-manager-api:8099）。
# 本文件位于 conf.d，处于 http 上下文，map 必须写在 server 块之外。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 模型上传走管理端代理回退时是 GB 级 body 流，默认 1M 会直接 413。
    client_max_body_size 0;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 哈希文件名的构建产物内容不可变，长缓存；入口页每次校验。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://center-cv-manager-api:8099;
        proxy_http_version 1.1;
        # SSH 终端 WebSocket（/api/v1/centers/:id/terminal）升级头透传。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 任务事件流不缓冲；终端/长任务会话空闲不断开。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # SPA 路由回退到入口页。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
