services:
  center-cv-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: center-cv-manager:local
    container_name: center-cv-manager
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      GIN_MODE: release
    ports:
      - "0.0.0.0:${CENTER_MANAGER_PORT:-8099}:8099"
      # registry sidecar 的对外入口：只绑回环地址，唯一访问方是本机 Docker 引擎
      # （本地构建后 push）与经管理端 SSH 反向隧道进来的中心。
      - "127.0.0.1:${REGISTRY_PORT:-5000}:5000"
    volumes:
      - center-manager-data:/app/data
      # 本地构建使用宿主 Docker 引擎（Docker Desktop 的 sock 对容器内非 root
      # 用户可读写；原生 Linux 宿主需自行调整 sock 的组权限）。
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8099/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 镜像仓库 sidecar：registry:3（2.8.3 与 OSS S3 兼容层不兼容，勿降级）。
  # 与管理端共享网络命名空间，三方统一经 127.0.0.1:5000 访问；存储在 OSS
  # S3 兼容层，本地无状态。config.yml 由管理端「软件仓库 → 配置镜像仓库」
  # 渲染到数据卷 registry/config.yml，修改后需重启本服务（docker compose
  # restart registry）生效。
  registry:
    image: registry:3.1.2
    container_name: center-cv-registry
    restart: unless-stopped
    network_mode: "service:center-cv-manager"
    command: ["serve", "/app/data/registry/config.yml"]
    volumes:
      - center-manager-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5000/v2/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  center-manager-data:
    external: true
    name: center-manager-data
