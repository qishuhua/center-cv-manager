services:
  center-cv-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: center-cv-manager:local
    container_name: center-cv-manager
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      GIN_MODE: release
    ports:
      - "0.0.0.0:8099:8099"
    volumes:
      - center-manager-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8099/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  center-manager-data:
    name: center-manager-data
