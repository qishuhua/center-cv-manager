services:
  # 后端 API：registry sidecar 挂在本服务网络命名空间上，API 进程（manifest
  # 查询/反向隧道目标）与本机 Docker 引擎（本地构建 push）统一经 127.0.0.1:5000
  # 访问；本服务使用宿主 Docker 引擎（Docker Desktop 的 sock 对容器内非 root
  # 用户可读写；原生 Linux 宿主需自行调整 sock 的组权限）。
  center-cv-manager-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: center-cv-manager-api:local
    container_name: center-cv-manager-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      GIN_MODE: release
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-5000}:5000"
    volumes:
      - center-manager-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8099/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 前端：nginx 静态 SPA + /api 反代。前端发布只重建本容器，不打断后端正在
  # 运行的构建/发布任务。
  center-cv-manager-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: center-cv-manager-web:local
    container_name: center-cv-manager-web
    restart: unless-stopped
    depends_on:
      center-cv-manager-api:
        condition: service_healthy
    ports:
      - "0.0.0.0:${CENTER_MANAGER_PORT:-8099}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 镜像仓库 sidecar：registry:3（2.8.3 与 OSS S3 兼容层不兼容，勿降级）。
  # 存储在 OSS S3 兼容层，本地无状态。config.yml 由管理端「软件仓库 → 配置
  # 镜像仓库」渲染到数据卷 registry/config.yml，修改后需重启本服务
  # （docker compose restart registry）生效。
  registry:
    image: registry:3.1.2
    container_name: center-cv-registry
    restart: unless-stopped
    network_mode: "service:center-cv-manager-api"
    command: ["serve", "/app/data/registry/config.yml"]
    volumes:
      - center-manager-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5000/v2/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  center-manager-data:
    external: true
    name: center-manager-data
