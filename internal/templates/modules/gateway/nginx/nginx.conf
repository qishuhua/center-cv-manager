# ============================================================
# Nginx 配置 - 所有部署入口共用（NVIDIA TensorRT / 登临 DLRT）
# 任务创建统一经过 Task Ingress，推理 Worker 不由 Nginx 直接代理。
# ============================================================

# worker 进程数：auto 表示自动匹配 CPU 核心数
# 总并发连接数 = worker_processes × worker_connections
worker_processes auto;

events {
    # 单个 worker 进程的最大并发连接数
    # 例如 4 核机器：4 × 4096 = 16384 并发连接
    worker_connections 4096;
}

http {
    # 加载 MIME 类型映射表，使 nginx 能正确识别文件类型
    include       /etc/nginx/mime.types;

    # 未匹配到 MIME 类型时的默认类型（二进制流，浏览器会触发下载）
    default_type  application/octet-stream;

    # ---------- 日志格式 ----------
    # 自定义日志格式 main，包含以下字段：
    #   $remote_addr          - 客户端 IP
    #   $remote_user          - 客户端用户名（Basic 认证时）
    #   $time_local           - 请求时间
    #   $request              - 请求方法和 URL
    #   $status               - HTTP 响应状态码
    #   $body_bytes_sent      - 响应体字节数
    #   $http_referer         - 来源页面
    #   $http_user_agent      - 客户端浏览器标识
    #   $http_x_forwarded_for - 代理链中的原始客户端 IP
    #   $upstream_addr        - 实际处理请求的后端地址（用于排查负载均衡）
    #   $upstream_status      - 后端返回的状态码
    #   $upstream_response_time - 后端响应耗时
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'upstream_addr="$upstream_addr" '
                      'upstream_status="$upstream_status" '
                      'upstream_response_time="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # ---------- 性能优化 ----------
    # sendfile: 使用操作系统内核直接传输文件，零拷贝，减少用户态/内核态切换
    sendfile        on;

    # keepalive 超时：客户端连接保持 65 秒，避免频繁 TCP 握手
    keepalive_timeout  65;

    # Task creation goes through the RabbitMQ Task Ingress.
    upstream cv_ingress {
        server 127.0.0.1:8090 max_fails=1 fail_timeout=10s;
        keepalive 64;
    }
    upstream nvr_download_backend {
        server 127.0.0.1:8300 max_fails=1 fail_timeout=10s;
    }
    upstream prometheus_backend {
        server 127.0.0.1:9090 max_fails=1 fail_timeout=10s;
    }
    upstream elasticsearch_backend {
        server 127.0.0.1:9200 max_fails=1 fail_timeout=10s;
    }
    upstream grafana_backend {
        server 127.0.0.1:3000 max_fails=1 fail_timeout=10s;
    }
    upstream kibana_backend {
        server 127.0.0.1:5601 max_fails=1 fail_timeout=10s;
    }

    # ---------- 虚拟主机 ----------
    server {
        # 监听本机 8080 端口，接收外部请求
        listen 8080;

        # 服务器名称，匹配请求头中的 Host 字段
        server_name localhost;

        # 客户端请求体最大大小（如上传文件），设为 100MB
        client_max_body_size 100M;

        # 错分计划落格事件入口：转发到 ingress 的 /fall-events/planned，鉴权
        # （misAuth 头）由 ingress 校验后经 ZeroMQ 广播给各 Worker 本地核验。
        # POST 不重试：重放会产生重复广播。
        location = /fall-events/planned {
            proxy_pass http://cv_ingress;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream off;
        }

        # Each create_task request is handled once by Task Ingress. Nginx must
        # never retry this POST, because that could create a duplicate task.
        location ~ ^/api/v3/\d+/create_task$ {
            proxy_pass http://cv_ingress;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream off;
        }

        # NVR 所有页面、认证、API 和下载统一使用 /nvr/。
        location = /nvr {
            absolute_redirect off;
            return 301 /nvr/;
        }

        location ^~ /nvr/ {
            proxy_pass http://nvr_download_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Prefix /nvr;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_next_upstream off;
            proxy_read_timeout 3700s;
            proxy_buffering off;
        }

        location = /prometheus {
            return 301 /prometheus/;
        }

        location /prometheus/ {
            proxy_pass http://prometheus_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # 开发机 Grafana 查询中心日志：只使用 Basic Auth。
        location = /elasticsearch {
            return 301 /elasticsearch/;
        }

        location /elasticsearch/ {
            auth_basic "Center logs";
            auth_basic_user_file /etc/nginx/secrets/grafana-logs.htpasswd;
            proxy_pass http://elasticsearch_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            proxy_pass http://grafana_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Grafana Actions require an absolute appUrl. Keep Compose portable
            # and inject the browser-facing origin into Grafana's boot HTML.
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter 'http://grafana.internal/grafana/' '$scheme://$http_host/grafana/';
            proxy_redirect http://grafana.internal/grafana/ /grafana/;
            proxy_read_timeout 300s;
        }

        location = /kibana {
            return 301 /kibana/;
        }

        location /kibana/ {
            proxy_pass http://kibana_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }
        location / {
            return 404;
        }
    }
}
