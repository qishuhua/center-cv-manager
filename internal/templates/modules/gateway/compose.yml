name: center-cv-gateway

services:
  nginx:
    image: nginx:1.31.3-alpine
    container_name: nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/grafana-logs.htpasswd:/etc/nginx/secrets/grafana-logs.htpasswd:ro
