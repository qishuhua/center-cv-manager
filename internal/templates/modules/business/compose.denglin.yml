name: center-cv-business

# Start infra and complete rabbitmq-init before starting business services.
x-worker-environment: &worker-environment
  # Denglin image does not define TZ; keep one explicit cross-platform value.
  TZ: Asia/Shanghai
  # Keep task ingress and alarm publishers on the same priority mapping.
  RABBITMQ_REALTIME_PRIORITY: ${RABBITMQ_REALTIME_PRIORITY:-5}
  RABBITMQ_PLAYBACK_PRIORITY: ${RABBITMQ_PLAYBACK_PRIORITY:-1}
  # 错分本地核验：订阅 ingress 的计划落格 ZeroMQ 广播（PUB）。默认回环地址
  # 与 ingress 的 CV_PLANNED_ZMQ_BIND 对应（8091）；多发布实例时改为逗号
  # 分隔的全部实例地址。
  CV_PLANNED_ZMQ_ENDPOINTS: ${CV_PLANNED_ZMQ_ENDPOINTS:-tcp://127.0.0.1:8091}
  # 计划落格 eventTime 的时区偏移（分钟），默认东八区。
  CV_EVENT_TIME_UTC_OFFSET_MINUTES: ${CV_EVENT_TIME_UTC_OFFSET_MINUTES:-480}
  # 业务日志等级：中心「Debug 模式」开关托管 module.env 的 LOG_LEVEL，
  # 未写入时回落这里的默认值 info。
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # 业务存图：中心「存图」开关托管 module.env 的 CV_SAVE_DEBUG_IMAGE，
  # 未写入时回落这里的默认值 0（不存图）。
  CV_SAVE_DEBUG_IMAGE: ${CV_SAVE_DEBUG_IMAGE:-0}
  # 业务仅解码：中心「仅解码模式」开关托管 module.env 的
  # CV_DECODE_ONLY_MODE，未写入时回落这里的默认值 0（正常推理）。
  CV_DECODE_ONLY_MODE: ${CV_DECODE_ONLY_MODE:-0}

x-worker-common: &worker-common
  image: center-cv-service:denglin
  pull_policy: never
  restart: unless-stopped
  runtime: dlrt
  network_mode: host
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  volumes:
    - /data/models:/data/models:ro
    - /data/logs:/data/logs
    - /data/media-resources:/data/media-resources
  healthcheck:
    test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/$${CV_LISTEN_PORT}'"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 300s

services:
  # CPU/GPU topology assumption: physical GPU 0-3 are local to NUMA 0 and
  # physical GPU 4-7 are local to NUMA 1. Verify this against the PCI topology
  # before production deployment. Each worker exposes four logical DL devices.
  center-cv-service-0:
    <<: *worker-common
    container_name: center-cv-service-0
    cpuset: "0-6,52-58"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-0
      CV_LISTEN_PORT: 8181
      DL_DEVICES: "0,1,2,3"

  center-cv-service-1:
    <<: *worker-common
    container_name: center-cv-service-1
    cpuset: "7-13,59-65"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-1
      CV_LISTEN_PORT: 8182
      DL_DEVICES: "4,5,6,7"

  center-cv-service-2:
    <<: *worker-common
    container_name: center-cv-service-2
    cpuset: "14-19,66-71"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-2
      CV_LISTEN_PORT: 8183
      DL_DEVICES: "8,9,10,11"

  center-cv-service-3:
    <<: *worker-common
    container_name: center-cv-service-3
    cpuset: "20-25,72-77"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-3
      CV_LISTEN_PORT: 8184
      DL_DEVICES: "12,13,14,15"

  center-cv-service-4:
    <<: *worker-common
    container_name: center-cv-service-4
    cpuset: "26-32,78-84"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-4
      CV_LISTEN_PORT: 8185
      DL_DEVICES: "16,17,18,19"

  center-cv-service-5:
    <<: *worker-common
    container_name: center-cv-service-5
    cpuset: "33-39,85-91"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-5
      CV_LISTEN_PORT: 8186
      DL_DEVICES: "20,21,22,23"

  center-cv-service-6:
    <<: *worker-common
    container_name: center-cv-service-6
    cpuset: "40-45,92-97"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-6
      CV_LISTEN_PORT: 8187
      DL_DEVICES: "24,25,26,27"

  center-cv-service-7:
    <<: *worker-common
    container_name: center-cv-service-7
    cpuset: "46-51,98-103"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-7
      CV_LISTEN_PORT: 8188
      DL_DEVICES: "28,29,30,31"

  center-cv-ingress:
    image: center-cv-ingress:latest
    pull_policy: never
    container_name: center-cv-ingress
    restart: unless-stopped
    network_mode: host
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      # 错分检测由 ingress 统一控制：开关打开时启动摄像机配置轮询（创建
      # 9/10 类任务）与计划落格 ZeroMQ 广播；关闭时不轮询、不绑 ZMQ 端口。
      # module.env 托管 CV_CAMERA_POLL_ENABLED/CV_WMS_URL/CV_MIS_AUTH。
      CV_CAMERA_POLL_ENABLED: ${CV_CAMERA_POLL_ENABLED:-0}
      CV_WMS_URL: ${CV_WMS_URL:-http://10.21.61.48:31995}
      CV_MIS_AUTH: ${CV_MIS_AUTH:-20260606123a}
      CV_CAMERA_CONFIG_PATH: ${CV_CAMERA_CONFIG_PATH:-/missort/api/cameraConfig/query}
      CV_CAMERA_POLL_INTERVAL_SECONDS: ${CV_CAMERA_POLL_INTERVAL_SECONDS:-3600}
      CV_CAMERA_CONFIG_TIMEOUT_MS: ${CV_CAMERA_CONFIG_TIMEOUT_MS:-5000}
      # 计划落格发布端口：仅回环绑定——局域网注入必须经网关 /fall-events/planned
      # 的 misAuth 鉴权，直连 ZMQ 可绕过鉴权。不用上游默认 8092（与
      # video-transcode 冲突，host 网络同机），固定 8091；Worker 端默认订阅
      # 地址与此对应。
      CV_PLANNED_ZMQ_BIND: ${CV_PLANNED_ZMQ_BIND:-tcp://127.0.0.1:8091}
      # Priority mapping is shared with worker alarm publishers.
      RABBITMQ_REALTIME_PRIORITY: ${RABBITMQ_REALTIME_PRIORITY:-5}
      RABBITMQ_PLAYBACK_PRIORITY: ${RABBITMQ_PLAYBACK_PRIORITY:-1}
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - /data/logs:/data/logs
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8090' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  video-transcode-service:
    image: video-transcode-service:latest
    pull_policy: never
    container_name: video-transcode-service
    restart: unless-stopped
    network_mode: host
    environment:
      # Keep the management API loopback-only and away from Nginx port 8080.
      HTTP_HOST: 127.0.0.1
      HTTP_PORT: "8092"
      TEST_ALARM_ENABLED: ${TEST_ALARM_ENABLED:-false}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      # 告警消息里的回放播放器入口（本中心网关静态页），随飞书告警测试开关托管。
      FEISHU_PLAYER_URL: ${FEISHU_PLAYER_URL:-}
      # 错分 9/10 核验结果不经业务回调，直发 WMS missort 接收端：
      # POST {CV_WMS_URL}/missort/api/detectResult/receive，misAuth 头取
      # CV_MIS_AUTH。与 ingress 共用 module.env 同名托管变量；空默认无害——
      # 源码默认空串，仅 9/10 消息需要，错分开启时 module.env 必有值。
      CV_WMS_URL: ${CV_WMS_URL:-}
      CV_MIS_AUTH: ${CV_MIS_AUTH:-}
      # 普通告警上报地址：按每条消息的 env 字段在 UAT/PRO 两套间选择。
      # 插值默认与源码内置值一致——不能写成 ${VAR:-} 空默认，空串会经环境
      # 变量覆盖掉源码内置地址。
      CV_PRO_POST_API: ${CV_PRO_POST_API:-https://jmsgw.jtexpress.com.cn/businessplan/aiVideoAnalysis/v2/algorithmCallBack}
      CV_UAT_POST_API: ${CV_UAT_POST_API:-https://uat-jmsgw.jtexpress.com.cn/businessplan/aiVideoAnalysis/v2/algorithmCallBack}
      ALARM_PRO_OSS_UPLOAD_URL_API: ${ALARM_PRO_OSS_UPLOAD_URL_API:-https://jmsgw.jtexpress.com.cn/businessplan/fileUpload/getUploadUrl}
      ALARM_UAT_OSS_UPLOAD_URL_API: ${ALARM_UAT_OSS_UPLOAD_URL_API:-https://uat-jmsgw.jtexpress.com.cn/businessplan/fileUpload/getUploadUrl}
    volumes:
      - /data/logs:/data/logs
      - /data/media-resources:/data/media-resources
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8092' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
