name: center-cv-business

# Start infra and complete rabbitmq-init before starting business services.
x-worker-environment: &worker-environment
  # Denglin image does not define TZ; keep one explicit cross-platform value.
  TZ: Asia/Shanghai
  # Keep task ingress and alarm publishers on the same priority mapping.
  RABBITMQ_REALTIME_PRIORITY: ${RABBITMQ_REALTIME_PRIORITY:-5}
  RABBITMQ_PLAYBACK_PRIORITY: ${RABBITMQ_PLAYBACK_PRIORITY:-1}
  # 业务日志等级：中心「Debug 模式」开关托管 module.env 的 LOG_LEVEL，
  # 未写入时回落这里的默认值 info。
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # 业务存图：中心「存图」开关托管 module.env 的 CV_SAVE_DEBUG_IMAGE，
  # 未写入时回落这里的默认值 0（不存图）。
  CV_SAVE_DEBUG_IMAGE: ${CV_SAVE_DEBUG_IMAGE:-0}

x-worker-common: &worker-common
  image: center-cv-service:denglin
  pull_policy: never
  restart: unless-stopped
  runtime: dlrt
  network_mode: host
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  volumes:
    - /data/models:/data/models:ro
    - /data/logs:/data/logs
    - /data/media-resources:/data/media-resources
  healthcheck:
    test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/$${CV_LISTEN_PORT}'"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 300s

services:
  # CPU/GPU topology assumption: physical GPU 0-3 are local to NUMA 0 and
  # physical GPU 4-7 are local to NUMA 1. Verify this against the PCI topology
  # before production deployment. Each worker exposes four logical DL devices.
  center-cv-service-0:
    <<: *worker-common
    container_name: center-cv-service-0
    cpuset: "0-6,52-58"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-0
      CV_LISTEN_PORT: 8181
      DL_DEVICES: "0,1,2,3"

  center-cv-service-1:
    <<: *worker-common
    container_name: center-cv-service-1
    cpuset: "7-13,59-65"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-1
      CV_LISTEN_PORT: 8182
      DL_DEVICES: "4,5,6,7"

  center-cv-service-2:
    <<: *worker-common
    container_name: center-cv-service-2
    cpuset: "14-19,66-71"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-2
      CV_LISTEN_PORT: 8183
      DL_DEVICES: "8,9,10,11"

  center-cv-service-3:
    <<: *worker-common
    container_name: center-cv-service-3
    cpuset: "20-25,72-77"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-3
      CV_LISTEN_PORT: 8184
      DL_DEVICES: "12,13,14,15"

  center-cv-service-4:
    <<: *worker-common
    container_name: center-cv-service-4
    cpuset: "26-32,78-84"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-4
      CV_LISTEN_PORT: 8185
      DL_DEVICES: "16,17,18,19"

  center-cv-service-5:
    <<: *worker-common
    container_name: center-cv-service-5
    cpuset: "33-39,85-91"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-5
      CV_LISTEN_PORT: 8186
      DL_DEVICES: "20,21,22,23"

  center-cv-service-6:
    <<: *worker-common
    container_name: center-cv-service-6
    cpuset: "40-45,92-97"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-6
      CV_LISTEN_PORT: 8187
      DL_DEVICES: "24,25,26,27"

  center-cv-service-7:
    <<: *worker-common
    container_name: center-cv-service-7
    cpuset: "46-51,98-103"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-7
      CV_LISTEN_PORT: 8188
      DL_DEVICES: "28,29,30,31"

  center-cv-ingress:
    image: center-cv-ingress:latest
    pull_policy: never
    container_name: center-cv-ingress
    restart: unless-stopped
    network_mode: host
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      CV_CAMERA_POLL_ENABLED: ${CV_CAMERA_POLL_ENABLED:-0}
      CV_WMS_URL: ${CV_WMS_URL:-http://10.21.61.48:31995}
      CV_MIS_AUTH: ${CV_MIS_AUTH:-20260606123a}
      CV_CAMERA_CONFIG_PATH: ${CV_CAMERA_CONFIG_PATH:-/missort/api/cameraConfig/query}
      CV_CAMERA_POLL_INTERVAL_SECONDS: ${CV_CAMERA_POLL_INTERVAL_SECONDS:-300}
      CV_CAMERA_CONFIG_TIMEOUT_MS: ${CV_CAMERA_CONFIG_TIMEOUT_MS:-5000}
      CHUTE_VERIFICATION_URL: ${CHUTE_VERIFICATION_URL:-http://127.0.0.1:8091}
      CV_DEVICE_SYNC_INTERVAL_SECONDS: ${CV_DEVICE_SYNC_INTERVAL_SECONDS:-5}
      # Priority mapping is shared with worker alarm publishers.
      RABBITMQ_REALTIME_PRIORITY: ${RABBITMQ_REALTIME_PRIORITY:-5}
      RABBITMQ_PLAYBACK_PRIORITY: ${RABBITMQ_PLAYBACK_PRIORITY:-1}
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - /data/logs:/data/logs
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8090' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  chute-verification-service:
    labels:
      com.center-manager.image.repository: chute-verification-service
    image: chute-verification-service:latest
    pull_policy: never
    container_name: chute-verification-service
    restart: unless-stopped
    network_mode: host
    environment:
      # 错分审核：两路落格事件匹配与结果发送，经 RabbitMQ 收发；始终部署，
      # module.env 提供共享鉴权；结果由 alarm-service 上报。
      CV_LISTEN_HOST: 127.0.0.1
      CV_MIS_AUTH: ${CV_MIS_AUTH:-20260606123a}
      # RabbitMQ 连接与任务优先级映射：新版镜像启动即校验连接变量，取值与
      # ingress/Worker 一致（infra RabbitMQ 为 guest@/）。
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_REALTIME_PRIORITY: ${RABBITMQ_REALTIME_PRIORITY:-5}
      RABBITMQ_PLAYBACK_PRIORITY: ${RABBITMQ_PLAYBACK_PRIORITY:-1}
    volumes:
      - /data/logs:/data/logs
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8091' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  video-transcode-service:
    image: video-transcode-service:latest
    pull_policy: never
    container_name: video-transcode-service
    restart: unless-stopped
    network_mode: host
    environment:
      # Keep the management API loopback-only and away from Nginx port 8080.
      HTTP_HOST: 127.0.0.1
      HTTP_PORT: "8092"
    volumes:
      - /data/logs:/data/logs
      - /data/media-resources:/data/media-resources
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8092' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  center-alarm-service:
    labels:
      com.center-manager.image.repository: center-alarm-service
    image: center-alarm-service:latest
    pull_policy: never
    container_name: center-alarm-service
    restart: unless-stopped
    network_mode: host
    environment:
      CV_WMS_URL: ${CV_WMS_URL:-http://10.21.61.48:31995}
      CV_MIS_AUTH: ${CV_MIS_AUTH:-20260606123a}
      # 转码结果上报拆分服务：消费 cv.alarm.report，素材直传 OSS + 业务告警回调。
      # 上报凭据沿用镜像内置默认；与转码共享 /data/media-resources。
      CV_HTTP_HOST: 127.0.0.1
      CV_HTTP_PORT: "8093"
      RABBITMQ_QUEUE: cv.alarm.report
    volumes:
      - /data/logs:/data/logs
      - /data/media-resources:/data/media-resources
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8093' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
