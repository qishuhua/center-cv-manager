global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: center-cv-service
    metrics_path: /api/metrics
    static_configs:
      # Eight workers expose four logical DL devices each. Physical GPU/NUMA
      # labels follow the deployment topology; verify against the PCI topology.
      - targets: ["127.0.0.1:8181"]
        labels: {worker: "center-cv-service-0", physical_gpu: "0", logical_gpus: "0-3", numa_node: "0"}
      - targets: ["127.0.0.1:8182"]
        labels: {worker: "center-cv-service-1", physical_gpu: "1", logical_gpus: "4-7", numa_node: "0"}
      - targets: ["127.0.0.1:8183"]
        labels: {worker: "center-cv-service-2", physical_gpu: "2", logical_gpus: "8-11", numa_node: "0"}
      - targets: ["127.0.0.1:8184"]
        labels: {worker: "center-cv-service-3", physical_gpu: "3", logical_gpus: "12-15", numa_node: "0"}
      - targets: ["127.0.0.1:8185"]
        labels: {worker: "center-cv-service-4", physical_gpu: "4", logical_gpus: "16-19", numa_node: "1"}
      - targets: ["127.0.0.1:8186"]
        labels: {worker: "center-cv-service-5", physical_gpu: "5", logical_gpus: "20-23", numa_node: "1"}
      - targets: ["127.0.0.1:8187"]
        labels: {worker: "center-cv-service-6", physical_gpu: "6", logical_gpus: "24-27", numa_node: "1"}
      - targets: ["127.0.0.1:8188"]
        labels: {worker: "center-cv-service-7", physical_gpu: "7", logical_gpus: "28-31", numa_node: "1"}
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "center_cv_(save_debug_image_enabled|alarm_enabled|aliyun_oss_enabled|env_is_pro)"
        action: drop
  - job_name: center-cv-ingress
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8090"]
  - job_name: video-transcode-service
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8092"]
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:15692"]

  # RabbitMQ's default /metrics endpoint is intentionally aggregated. Scrape
  # the native per-object endpoint separately so Grafana can group backlog and
  # consumer metrics for every managed task and transcode queue.
  - job_name: rabbitmq-per-object
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["127.0.0.1:15692"]

  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["127.0.0.1:8084"]

  - job_name: log-metrics
    static_configs:
      - targets: ["127.0.0.1:3903"]

  - job_name: denglin-gpu
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9400"]

  - job_name: service-http-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://127.0.0.1:8181/api/healthz"]
        labels: {worker: "center-cv-service-0", physical_gpu: "0"}
      - targets: ["http://127.0.0.1:8182/api/healthz"]
        labels: {worker: "center-cv-service-1", physical_gpu: "1"}
      - targets: ["http://127.0.0.1:8183/api/healthz"]
        labels: {worker: "center-cv-service-2", physical_gpu: "2"}
      - targets: ["http://127.0.0.1:8184/api/healthz"]
        labels: {worker: "center-cv-service-3", physical_gpu: "3"}
      - targets: ["http://127.0.0.1:8185/api/healthz"]
        labels: {worker: "center-cv-service-4", physical_gpu: "4"}
      - targets: ["http://127.0.0.1:8186/api/healthz"]
        labels: {worker: "center-cv-service-5", physical_gpu: "5"}
      - targets: ["http://127.0.0.1:8187/api/healthz"]
        labels: {worker: "center-cv-service-6", physical_gpu: "6"}
      - targets: ["http://127.0.0.1:8188/api/healthz"]
        labels: {worker: "center-cv-service-7", physical_gpu: "7"}
      - targets: ["http://127.0.0.1:8090/readyz"]
        labels: {service: "center-cv-ingress"}
      - targets: ["http://127.0.0.1:8092/readyz"]
        labels: {service: "video-transcode-service"}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
  # Check application readiness separately from HTTP/TCP liveness.
  - job_name: service-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://127.0.0.1:8181/api/readyz"]
        labels: {name: "center-cv-service-0"}
      - targets: ["http://127.0.0.1:8182/api/readyz"]
        labels: {name: "center-cv-service-1"}
      - targets: ["http://127.0.0.1:8183/api/readyz"]
        labels: {name: "center-cv-service-2"}
      - targets: ["http://127.0.0.1:8184/api/readyz"]
        labels: {name: "center-cv-service-3"}
      - targets: ["http://127.0.0.1:8185/api/readyz"]
        labels: {name: "center-cv-service-4"}
      - targets: ["http://127.0.0.1:8186/api/readyz"]
        labels: {name: "center-cv-service-5"}
      - targets: ["http://127.0.0.1:8187/api/readyz"]
        labels: {name: "center-cv-service-6"}
      - targets: ["http://127.0.0.1:8188/api/readyz"]
        labels: {name: "center-cv-service-7"}
      - targets: ["http://127.0.0.1:8090/readyz"]
        labels: {name: "center-cv-ingress"}
      - targets: ["http://127.0.0.1:8092/readyz"]
        labels: {name: "video-transcode-service"}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: service-tcp-health
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 127.0.0.1:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
