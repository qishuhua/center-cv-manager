name: center-cv-infra

services:
  rabbitmq:
    image: rabbitmq:4.3.5-management
    pull_policy: missing
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    network_mode: host
    environment:
      RABBITMQ_NODENAME: rabbit@localhost
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 60s

  rabbitmq-init:
    image: rabbitmq:4.3.5-management
    pull_policy: missing
    container_name: rabbitmq-init
    restart: "no"
    network_mode: host
    environment:
      RABBITMQADMIN_TARGET_HOST: 127.0.0.1
      RABBITMQADMIN_TARGET_PORT: 15672
      RABBITMQADMIN_USERNAME: guest
      RABBITMQADMIN_PASSWORD: guest
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_DEFAULT_USER: guest
    entrypoint: ["/bin/sh", "/opt/rabbitmq/init.sh"]
    volumes:
      - ./rabbitmq/init.sh:/opt/rabbitmq/init.sh:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 中心任务状态存储（redis:7.2）：ingress 是唯一写入方，落当前任务清单
  # （taskid、开始/结束时间、运行状态）；查询一律经网关 /api/v1/tasks，
  # 不向中心局域网暴露端口。host 网络只绑回环；noeviction 禁止逐出正在
  # 运行的任务记录；AOF everysec 保证容器重启不丢状态。
  redis:
    image: redis:7.2-alpine
    pull_policy: missing
    container_name: redis
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  rabbitmq-data:
    name: ${CENTER_CV_DATA_PREFIX:-center-cv-infra}_rabbitmq-data
  redis-data:
    name: ${CENTER_CV_DATA_PREFIX:-center-cv-infra}_redis-data
