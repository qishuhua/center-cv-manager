x-worker-environment: &worker-environment
  # Denglin image does not define TZ; keep one explicit cross-platform value.
  TZ: Asia/Shanghai
  # Keep task ingress and alarm publishers on the same priority mapping.
  RABBITMQ_REALTIME_PRIORITY: ${RABBITMQ_REALTIME_PRIORITY:-5}
  RABBITMQ_PLAYBACK_PRIORITY: ${RABBITMQ_PLAYBACK_PRIORITY:-1}

x-worker-common: &worker-common
  image: center-cv-service:denglin
  labels:
    com.center-manager.image.repository: center-cv-service
  pull_policy: never
  restart: unless-stopped
  runtime: dlrt
  network_mode: host
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  volumes:
    - /data/models:/data/models:ro
    - /data/logs:/data/logs
    - /data/media-resources:/data/media-resources
  depends_on:
    rabbitmq-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/$${CV_LISTEN_PORT}'"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 300s

services:
  rabbitmq:
    image: rabbitmq:4.3.5-management
    pull_policy: missing
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    network_mode: host
    environment:
      # Host networking does not provide Docker DNS for the container hostname.
      # Keep the Erlang node on the loopback name so epmd can resolve it.
      RABBITMQ_NODENAME: rabbit@localhost
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./monitoring/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 60s
  rabbitmq-init:
    image: rabbitmq:4.3.5-management
    pull_policy: missing
    container_name: rabbitmq-init
    restart: "no"
    network_mode: host
    environment:
      RABBITMQADMIN_TARGET_HOST: 127.0.0.1
      RABBITMQADMIN_TARGET_PORT: 15672
      RABBITMQADMIN_USERNAME: guest
      RABBITMQADMIN_PASSWORD: guest
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_DEFAULT_USER: guest
    entrypoint: ["/bin/sh", "/opt/rabbitmq/init.sh"]
    volumes:
      - ./monitoring/rabbitmq/init.sh:/opt/rabbitmq/init.sh:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
  nginx:
    image: nginx:1.31.3-alpine
    container_name: nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.full.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/grafana-logs.htpasswd:/etc/nginx/secrets/grafana-logs.htpasswd:ro
    depends_on:
      center-cv-ingress:
        condition: service_healthy
  # CPU/GPU topology assumption: physical GPU 0-3 are local to NUMA 0 and
  # physical GPU 4-7 are local to NUMA 1. Verify this against the PCI topology
  # before production deployment. Each worker exposes four logical DL devices.
  center-cv-service-0:
    <<: *worker-common
    container_name: center-cv-service-0
    cpuset: "0-6,52-58"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-0
      CV_LISTEN_PORT: 8181
      DL_DEVICES: "0,1,2,3"

  center-cv-service-1:
    <<: *worker-common
    container_name: center-cv-service-1
    cpuset: "7-13,59-65"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-1
      CV_LISTEN_PORT: 8182
      DL_DEVICES: "4,5,6,7"

  center-cv-service-2:
    <<: *worker-common
    container_name: center-cv-service-2
    cpuset: "14-19,66-71"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-2
      CV_LISTEN_PORT: 8183
      DL_DEVICES: "8,9,10,11"

  center-cv-service-3:
    <<: *worker-common
    container_name: center-cv-service-3
    cpuset: "20-25,72-77"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-3
      CV_LISTEN_PORT: 8184
      DL_DEVICES: "12,13,14,15"

  center-cv-service-4:
    <<: *worker-common
    container_name: center-cv-service-4
    cpuset: "26-32,78-84"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-4
      CV_LISTEN_PORT: 8185
      DL_DEVICES: "16,17,18,19"

  center-cv-service-5:
    <<: *worker-common
    container_name: center-cv-service-5
    cpuset: "33-39,85-91"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-5
      CV_LISTEN_PORT: 8186
      DL_DEVICES: "20,21,22,23"

  center-cv-service-6:
    <<: *worker-common
    container_name: center-cv-service-6
    cpuset: "40-45,92-97"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-6
      CV_LISTEN_PORT: 8187
      DL_DEVICES: "24,25,26,27"

  center-cv-service-7:
    <<: *worker-common
    container_name: center-cv-service-7
    cpuset: "46-51,98-103"
    environment:
      <<: *worker-environment
      APPNAME: center-cv-service-7
      CV_LISTEN_PORT: 8188
      DL_DEVICES: "28,29,30,31"

  center-cv-ingress:
    image: center-cv-ingress:latest
    labels:
      com.center-manager.image.repository: center-cv-ingress
    pull_policy: never
    container_name: center-cv-ingress
    restart: unless-stopped
    network_mode: host
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      # Priority mapping is shared with worker alarm publishers.
      RABBITMQ_REALTIME_PRIORITY: ${RABBITMQ_REALTIME_PRIORITY:-5}
      RABBITMQ_PLAYBACK_PRIORITY: ${RABBITMQ_PLAYBACK_PRIORITY:-1}
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - /data/logs:/data/logs
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8090' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully

  video-transcode-service:
    image: video-transcode-service:latest
    labels:
      com.center-manager.image.repository: video-transcode
    pull_policy: never
    container_name: video-transcode-service
    restart: unless-stopped
    network_mode: host
    environment:
      # Keep the management API loopback-only and away from Nginx port 8080.
      HTTP_HOST: 127.0.0.1
      HTTP_PORT: "8092"
      # Select the service's built-in production callback/upload endpoints.
      CV_ENV_IS_PRO: "1"
    volumes:
      - /data/logs:/data/logs
      - /data/media-resources:/data/media-resources
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8092' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.13.1
    pull_policy: missing
    container_name: prometheus
    restart: unless-stopped

    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=0.0.0.0:9090
      - --web.external-url=/prometheus/
      - --web.route-prefix=/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./monitoring/prometheus/prometheus.denglin.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerting/rules:/etc/prometheus/alert-rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - rabbitmq
      - node-exporter
      - cadvisor
      - blackbox-exporter
      - mtail
      - denglin-gpu-exporter

  alertmanager:
    # This configuration uses v0.34.0 custom payload and route labels.
    image: prom/alertmanager:v0.34.0
    pull_policy: missing
    container_name: alertmanager
    restart: unless-stopped
    network_mode: host
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
      - --cluster.listen-address=
    volumes:
      - ./monitoring/alerting/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alerting/templates:/etc/alertmanager/templates:ro
      - type: bind
        source: ./monitoring/alerting/feishu-webhook-url
        target: /run/secrets/feishu-webhook-url
        read_only: true
        bind:
          create_host_path: false
      - alertmanager-data:/alertmanager
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  grafana:
    image: grafana/grafana:13.1.1
    pull_policy: missing
    container_name: grafana
    restart: unless-stopped

    network_mode: host
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Nginx replaces this placeholder in Grafana's boot HTML with the
      # browser-facing scheme and Host, so deployments do not need a site IP.
      GF_SERVER_ROOT_URL: "http://grafana.internal/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources-host:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards-denglin:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards/center-cv-overview.denglin.json:/var/lib/grafana/dashboards/center-cv-overview.json:ro
    # Hide stale dashboard mountpoint files without changing database or dashboard IDs.
    tmpfs:
      - /var/lib/grafana/dashboards
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.12.1
    pull_policy: missing
    container_name: node-exporter
    restart: unless-stopped

    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=0.0.0.0:9100
    volumes:
      - /:/host:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    pull_policy: missing
    container_name: cadvisor
    restart: unless-stopped

    network_mode: host
    privileged: true
    environment:
      # The image healthcheck defaults to port 8080, while this stack moves the
      # cAdvisor HTTP endpoint to 8084 to avoid the Nginx port.
      CADVISOR_HEALTHCHECK_URL: http://localhost:8084/healthz
    command:
      - --port=8084
      - --listen_ip=0.0.0.0
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    pull_policy: missing
    container_name: blackbox-exporter
    restart: unless-stopped

    network_mode: host
    extra_hosts:
      - host.docker.internal:host-gateway
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
      - --web.listen-address=0.0.0.0:9115
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  mtail:
    image: ghcr.io/google/mtail:3.0.8
    pull_policy: missing
    container_name: mtail
    restart: unless-stopped
    network_mode: host
    command:
      - --address=127.0.0.1
      - --port=3903
      - --progs=/etc/mtail
      - --logs=/data/logs/*.log
      - --logtostderr
    volumes:
      - ./monitoring/mtail:/etc/mtail:ro
      - /data/logs:/data/logs:ro

  denglin-gpu-exporter:
    image: denglin-gpu-exporter:v0.6.10-202604011052
    # Vendor image is distributed inside the offline dl-exporter package.
    pull_policy: never
    container_name: denglin-gpu-exporter
    restart: unless-stopped
    runtime: dlrt
    network_mode: host
    environment:
      DENGLIN_DEVICES: all
    volumes:
      - /proc:/procdir:ro
      - ./monitoring/denglin-gpu-exporter:/etc/config:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    pull_policy: missing
    container_name: elasticsearch
    hostname: elasticsearch
    extra_hosts:
      - elasticsearch:127.0.0.1
    restart: unless-stopped

    network_mode: host
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  elasticsearch-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    pull_policy: missing
    container_name: elasticsearch-init
    restart: "no"

    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        curl -fsS -X PUT
        http://127.0.0.1:9200/_ilm/policy/center-cv-logs-retention
        -H 'Content-Type: application/json'
        --data-binary @/config/center-cv-logs-ilm-policy.json
        &&
        curl -fsS -X PUT
        'http://127.0.0.1:9200/center-cv-logs-*/_settings?allow_no_indices=true&ignore_unavailable=true'
        -H 'Content-Type: application/json'
        -d '{"index.lifecycle.name":"center-cv-logs-retention"}'
    volumes:
      - ./monitoring/elasticsearch/center-cv-logs-ilm-policy.json:/config/center-cv-logs-ilm-policy.json:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    pull_policy: missing
    container_name: kibana
    restart: unless-stopped

    network_mode: host
    environment:
      ELASTICSEARCH_HOSTS: '["http://127.0.0.1:9200"]'
      SERVER_HOST: 0.0.0.0
      SERVER_NAME: kibana
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      XPACK_SECURITY_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/kibana/api/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    pull_policy: missing
    container_name: kibana-init
    restart: "no"
    network_mode: host
    entrypoint: ["/bin/sh", "/config/init.sh"]
    volumes:
      - ./monitoring/kibana/init.sh:/config/init.sh:ro
    depends_on:
      kibana:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.19.0
    pull_policy: missing
    container_name: filebeat
    restart: unless-stopped

    network_mode: host
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /data/logs:/data/logs:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-init:
        condition: service_completed_successfully

volumes:
  rabbitmq-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  elasticsearch-data:
  filebeat-data:
