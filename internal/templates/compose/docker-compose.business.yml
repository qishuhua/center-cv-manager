services:
  nginx:
    image: nginx:1.31.3-alpine
    container_name: nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/grafana-logs.htpasswd:/etc/nginx/secrets/grafana-logs.htpasswd:ro
    depends_on:
      - center-cv-service
      - hk-alarm-reporter

  center-cv-service:
    image: center-cv-service:${CENTER_CV_IMAGE_TAG:-nvidia}

    labels:

      com.center-manager.image.repository: center-cv-service
    pull_policy: never
    container_name: center-cv-service
    restart: unless-stopped
    runtime: ${CENTER_CV_CONTAINER_RUNTIME:-nvidia}
    network_mode: host
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      TZ: Asia/Shanghai
      NVIDIA_VISIBLE_DEVICES: all
      DL_DEVICES: all
    volumes:
      - /data/models:/data/models:ro
      - /data/logs:/data/logs
      - /data/media-resources:/data/media-resources

  hk-alarm-reporter:
    image: hk-alarm-reporter:latest
    pull_policy: never
    container_name: hk-alarm-reporter
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      ALARM_LISTEN_PORT: 9001
      CV_LISTEN_PORT: 8082
      APPNAME: hk-alarm-reporter
      LOGDIR: /data/logs
      LOG_LEVEL: info
    volumes:
      - /data/logs:/data/logs
